[workspace]
resolver = "2"
members = [
    "crates/leonida-core",
    "crates/leonida-cli",
    "crates/leonida-wasm",
    "crates/leonida-server",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emrpg/gta6-oot-rea-reverse-engineering"

[workspace.dependencies]
leonida-core = { path = "crates/leonida-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
